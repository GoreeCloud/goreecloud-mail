platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: GoreeCloud Mail has provider and trusted-backend administration surfaces, but accepted GoreeCloud Manager registration, visibility, policy, and target-runtime integration are not established.

  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - server/message-content-policy.js
      - server/restrictive-html-sanitizer.js
      - SECURITY.md
      - SPECIFICATIONS.md
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/mail/MailSessionBinding.kt
    notes: Source implements privacy-oriented message-content and remote-content boundaries, and the Android Development client keeps transport, synchronization, storage, attachments, and reusable credentials fail-closed. No accepted Privacy Shield policy/runtime integration, purpose/retention authority, target-environment minimization evidence, or production privacy acceptance is established.

  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - contracts/wardveil.mail-attachment-scan.json
      - server/attachment-delivery-service.js
      - server/gmail-outgoing-attachment-security.js
      - server/wardveil-scan-client.js
      - docs/mail-wardveil-runtime-acceptance.md
      - scripts/run-mail-wardveil-runtime-acceptance.mjs
      - clients/android/README.md
    notes: Incoming/download and outgoing Gmail send/draft attachment paths have source validation and bounded controlled-provider target-runtime validation against Wardveil Scan. Real Gmail attachment execution, Android attachment handling, production service identity and credential lifecycle, authoritative Wardveil Audit/Security Center provenance, quarantine execution/readback, and broad production Wardveil acceptance remain unproven; this bounded evidence does not authorize a general Protected by Wardveil claim.

  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - server/sqlite-state.js
      - server/sqlite-backup.js
      - server/sqlite-migrations.js
      - docs/database-maintenance.md
      - docs/persistence-schema.sql
      - clients/android/README.md
    notes: Durable trusted-backend SQLite state, migrations, and a bounded backup primitive exist, while the Android Development client deliberately has no accepted local mail store. Complete Mail-owned backup scope, Android recovery semantics, restore implementation and drills, credential/provenance treatment, target-environment recovery validation, and accepted Everkeep integration are incomplete.

  glaze_ui:
    result: applicable-migration-required
    version: "1.4.0"
    evidence:
      - web/index.html
      - web/styles.css
      - web/attachment-security.css
      - contracts/glaze.mail-attachment-security-presentation.json
      - scripts/validate_glaze_mail_attachment_security.py
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/mail/GlazeMailTheme.kt
      - docs/glaze-ui-v1.4-android-adoption.md
      - scripts/validate_android_glaze_v1_4.py
    notes: The native Android Development client targets current Stable GLAZE UI V1.4 / 1.4.0 at exact Stable revision 84cb3db4884042f0fa25ed6d475a127fb110f596 and remains ADOPTION_IN_PROGRESS. The existing web application still carries older repository-local Glaze mapping and rendered evidence, so Mail as a whole remains migration-required. No historical web evidence or Android source/build evidence is promoted into repository-wide V1.4 rendered, accessibility, representative-environment, Human Visual Excellence, or V1.4.1 manual/device acceptance.

  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - docs/architecture.md
      - SPECIFICATIONS.md
    notes: GoreeCloud Mail defines provider-independent application contracts, but canonical GoreeCloud Mesh service registration, capabilities, dependencies, event contracts, authenticated delivery, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - server/session-context.js
      - server/provider-account-service.js
      - server/credential-vault.js
      - server/encrypted-file-credential-vault.js
      - docs/credential-vault.md
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/mail/MailSessionBinding.kt
    notes: Mail has trusted session-derived application identity and provider-account isolation boundaries. The Android client now has a source-ready, non-secret principal/account/audience/lifetime binding contract pinned to GoreeCloud Identity native-session semantics, but this is not deployed Identity runtime. Accepted GoreeCloud Identity application registration, credential/session exchange, protected credential storage, production service identity/key lifecycle, browser sessions, server-side migration, and production provider-credential custody remain blocked. External-provider OAuth remains a separate authority.

  sync:
    result: applicable-blocked
    version: null
    evidence:
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/mail/MailCapabilitySnapshot.kt
      - SPECIFICATIONS.md
    notes: Provider synchronization concepts and future Android background/offline behavior do not establish GoreeCloud Sync acceptance. No accepted change tracking, version coordination, authorized replication, conflict reconciliation, offline resume, cross-device state continuity, or Sync runtime integration is established. Sync remains distinct from provider mail transport, local cache/storage, and Everkeep backup/recovery.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and validate the complete GoreeCloud Mail-owned backup scope across durable SQLite state, configuration, minimized security provenance, and other authorized local/trusted-backend state.
      - Keep external-provider-authoritative mailbox content and provider credentials within their respective authority and custody boundaries rather than treating Mail backup as a second authoritative mailbox.
      - Keep GoreeCloud Sync replication and offline-cache state distinct from backup truth.
      - Establish accepted Everkeep backup evidence and target-environment recovery procedures before production readiness.
  restore:
    required: true
    requirements:
      - Implement and validate a documented restore path for all approved Mail-owned durable state covered by backup.
      - Preserve account isolation, provider-account ownership, Identity ownership, migration integrity, minimized security provenance, and credential-reference boundaries during restore.
      - Execute representative target-environment restore and rollback drills before recovery or Stable qualification is claimed.
  export:
    required: true
    requirements:
      - Preserve provider-independent portability for Mail-owned configuration and supported user-controlled application state through versioned documented formats where applicable.
      - Do not represent external-provider mailbox hosting or Internet mail transport as GoreeCloud Mail-owned export authority.
  portability:
    required: true
    requirements:
      - Keep the Courier provider abstraction independent from Gmail-specific assumptions and fail closed when an account lacks an authorized provider capability.
      - Define migration and portability behavior for Mail-owned durable state, configuration, and native clients without transferring external-provider authority into GoreeCloud Mail.
      - Validate Android and future Linux client portability only after the applicable first-party client capabilities pass governed acceptance.

external_dependencies:
  - name: Node.js
    purpose: Development trusted-backend runtime and automated validation.
    required: true
    version_constraint: ">=22"
  - name: Compatible external email provider
    purpose: Authoritative mailbox hosting and Internet mail transport through approved provider APIs or standards-based protocols.
    required: true
    version_constraint: null
  - name: Wardveil Scan
    purpose: Required security authority for the currently guarded incoming and outgoing attachment admission paths when those paths are enabled.
    required: true
    version_constraint: null
  - name: Android platform
    purpose: Native Android application runtime and platform integration environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "1.4.0"
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.4.0
    - node>=22
    - android-api>=29
  provides:
    - courier.provider-capabilities/1

