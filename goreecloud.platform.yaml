  blockers:
    - Native Android targets GLAZE UI V1.4, but repository-wide web migration plus fresh V1.4 rendered, interaction, accessibility, responsive/form-factor, representative-environment/device, performance, rollback, Human Visual Excellence, and applicable V1.4.1 manual/device acceptance remain incomplete.
    - GoreeCloud Manager integration and acceptance are not established.
    - Privacy Shield runtime/policy integration and production privacy acceptance are not established.
    - Wardveil attachment enforcement is bounded and runtime-validated only for the controlled-provider consumer matrix; real Gmail execution, Android attachment handling, production identity/credential lifecycle, authoritative Audit/Security Center provenance, quarantine, and broad production acceptance remain outstanding.
    - Everkeep integration, complete Mail-owned backup scope, Android recovery behavior, restore implementation, representative recovery drills, rollback, and production continuity acceptance remain incomplete.
    - GoreeCloud Mesh registration, capability/event publication, authenticated delivery, and runtime acceptance are not established.
    - GoreeCloud Identity native application registration, credential/session runtime, protected credential storage, server-side migration, production service/browser/provider-credential custody, and accepted Identity authority remain incomplete; provider authorization remains a separate authority.
    - GoreeCloud Sync change tracking, authorized replication, version/conflict reconciliation, offline resume, and cross-device continuity acceptance are not established.
    - The trusted Mail API does not yet publish a complete versioned Platform Contract API declaration or accepted health/readiness interfaces.
    - Real Gmail and standards-based IMAP/SMTP provider execution and production interoperability remain unaccepted.
    - Android account transport, live provider reads/writes, protected local mail storage, background synchronization, push, and attachment handling remain unavailable even though the native shell, V1.4 source mapping, and session-binding prerequisite are source-validated.
    - The Linux first-party client remains incomplete.
    - Complete offline queue/replay, synchronization conflict handling, provider production observability, upgrade/rollback, account-isolation acceptance, and security/privacy failure-mode validation remain incomplete.
    - Production signing, SBOM/provenance, deployment approval, representative target-environment/device acceptance, Release Candidate entry, and Stable qualification remain outstanding.
