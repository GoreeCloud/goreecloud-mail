name: Validate GoreeCloud Mail

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: goreecloud-mail-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test Wardveil attachment security consumer
        run: python3 scripts/test_mail_attachment_security.py

      - name: Validate Wardveil Mail integration contract
        run: python3 scripts/validate_wardveil_mail_integration.py

      - name: Compile Mail security tooling
        run: python3 -m py_compile reference/mail_attachment_security.py scripts/test_mail_attachment_security.py scripts/validate_wardveil_mail_integration.py
